<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 252" width="100%" height="100%">
  <defs>
    <filter id="shadow-lev" x="-2%" y="-3%" width="104%" height="110%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
    <marker id="arrow-lev" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#64748b"/>
    </marker>
    <marker id="arrow-pull" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#ea580c"/>
    </marker>
    <marker id="arrow-step-down" viewBox="0 0 10 10" refX="5" refY="7" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M 1 0 L 5 8 L 9 0 z" fill="#94a3b8"/>
    </marker>
    <linearGradient id="grad-lev-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
  </defs>

  <!-- Outer Card -->
  <rect x="2" y="2" width="616" height="248" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow-lev)"/>

  <!-- ================= LEFT: Scatter Plot of Leverage ================= -->
  <g transform="translate(12, 10)">
    <!-- Plot Background -->
    <rect x="0" y="0" width="318" height="232" rx="8" fill="url(#grad-lev-bg)" stroke="#e2e8f0" stroke-width="1"/>

    <!-- Grid lines -->
    <line x1="45" y1="65" x2="305" y2="65" stroke="#f1f5f9" stroke-width="1" stroke-dasharray="2,2"/>
    <line x1="45" y1="115" x2="305" y2="115" stroke="#f1f5f9" stroke-width="1" stroke-dasharray="2,2"/>
    <line x1="45" y1="160" x2="305" y2="160" stroke="#f1f5f9" stroke-width="1" stroke-dasharray="2,2"/>

    <!-- Axes -->
    <line x1="45" y1="195" x2="308" y2="195" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow-lev)"/>
    <text x="308" y="210" font-family="'Hiragino Kaku Gothic ProN', 'Noto Sans JP', sans-serif" font-size="10" font-weight="700" fill="#475569" text-anchor="end">売上高 (X) →</text>

    <line x1="45" y1="195" x2="45" y2="20" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow-lev)"/>
    <text x="45" y="15" font-family="'Hiragino Kaku Gothic ProN', 'Noto Sans JP', sans-serif" font-size="10" font-weight="800" fill="#334155">純利益 (Y) ↑</text>

    <!-- Cluster Ellipse Indicator -->
    <ellipse cx="63" cy="182" rx="20" ry="14" fill="#3b82f6" fill-opacity="0.12" stroke="#3b82f6" stroke-width="1.2" stroke-dasharray="2,2"/>

    <!-- 45 Cluster Dots -->
    <g>
      <circle cx="66.6" cy="173.5" r="2.3" fill="#334155" opacity="0.65"/>\n      <circle cx="55.8" cy="186.3" r="2.8" fill="#334155" opacity="0.65"/>\n      <circle cx="73.2" cy="174.6" r="2.5" fill="#334155" opacity="0.65"/>\n      <circle cx="50.8" cy="176.9" r="2.6" fill="#334155" opacity="0.65"/>\n      <circle cx="50.7" cy="176.6" r="2.8" fill="#334155" opacity="0.65"/>\n      <circle cx="64.2" cy="177.0" r="2.7" fill="#334155" opacity="0.65"/>\n      <circle cx="71.0" cy="173.1" r="3.0" fill="#334155" opacity="0.65"/>\n      <circle cx="68.2" cy="179.1" r="2.2" fill="#334155" opacity="0.65"/>\n      <circle cx="74.9" cy="179.1" r="2.1" fill="#334155" opacity="0.65"/>\n      <circle cx="52.5" cy="188.3" r="2.7" fill="#334155" opacity="0.65"/>\n      <circle cx="71.0" cy="186.1" r="2.6" fill="#334155" opacity="0.65"/>\n      <circle cx="75.3" cy="179.8" r="2.7" fill="#334155" opacity="0.65"/>\n      <circle cx="71.6" cy="184.1" r="3.0" fill="#334155" opacity="0.65"/>\n      <circle cx="65.0" cy="185.7" r="2.1" fill="#334155" opacity="0.65"/>\n      <circle cx="55.9" cy="178.2" r="2.1" fill="#334155" opacity="0.65"/>\n      <circle cx="56.1" cy="174.8" r="2.3" fill="#334155" opacity="0.65"/>\n      <circle cx="66.5" cy="179.6" r="2.4" fill="#334155" opacity="0.65"/>\n      <circle cx="55.4" cy="177.8" r="3.1" fill="#334155" opacity="0.65"/>\n      <circle cx="66.8" cy="184.0" r="2.2" fill="#334155" opacity="0.65"/>\n      <circle cx="69.0" cy="175.9" r="2.5" fill="#334155" opacity="0.65"/>\n      <circle cx="75.7" cy="184.5" r="2.7" fill="#334155" opacity="0.65"/>\n      <circle cx="67.8" cy="188.2" r="2.9" fill="#334155" opacity="0.65"/>\n      <circle cx="56.0" cy="173.6" r="2.4" fill="#334155" opacity="0.65"/>\n      <circle cx="57.0" cy="176.8" r="3.1" fill="#334155" opacity="0.65"/>\n      <circle cx="72.8" cy="178.7" r="2.8" fill="#334155" opacity="0.65"/>\n      <circle cx="60.3" cy="189.5" r="2.6" fill="#334155" opacity="0.65"/>\n      <circle cx="56.9" cy="177.4" r="2.7" fill="#334155" opacity="0.65"/>\n      <circle cx="56.8" cy="183.5" r="3.1" fill="#334155" opacity="0.65"/>\n      <circle cx="60.4" cy="176.9" r="3.2" fill="#334155" opacity="0.65"/>\n      <circle cx="63.2" cy="174.6" r="2.1" fill="#334155" opacity="0.65"/>\n      <circle cx="52.9" cy="184.3" r="3.0" fill="#334155" opacity="0.65"/>\n      <circle cx="61.0" cy="174.1" r="2.5" fill="#334155" opacity="0.65"/>\n      <circle cx="75.9" cy="182.5" r="3.2" fill="#334155" opacity="0.65"/>\n      <circle cx="72.4" cy="173.2" r="2.9" fill="#334155" opacity="0.65"/>\n      <circle cx="67.7" cy="182.7" r="2.3" fill="#334155" opacity="0.65"/>\n      <circle cx="66.7" cy="175.0" r="2.5" fill="#334155" opacity="0.65"/>\n      <circle cx="61.8" cy="190.2" r="3.1" fill="#334155" opacity="0.65"/>\n      <circle cx="56.8" cy="182.0" r="2.2" fill="#334155" opacity="0.65"/>\n      <circle cx="73.7" cy="188.7" r="2.4" fill="#334155" opacity="0.65"/>\n      <circle cx="66.6" cy="184.0" r="2.2" fill="#334155" opacity="0.65"/>\n      <circle cx="69.8" cy="182.7" r="2.9" fill="#334155" opacity="0.65"/>\n      <circle cx="63.8" cy="173.0" r="2.4" fill="#334155" opacity="0.65"/>\n      <circle cx="50.5" cy="189.7" r="3.1" fill="#334155" opacity="0.65"/>\n      <circle cx="71.6" cy="178.5" r="2.1" fill="#334155" opacity="0.65"/>\n      <circle cx="72.8" cy="190.0" r="2.1" fill="#334155" opacity="0.65"/>
    </g>

    <!-- Cluster Callout Badge -->
    <path d="M 63 167 L 78 148" stroke="#3b82f6" stroke-width="1.2" fill="none"/>
    <rect x="65" y="124" width="112" height="25" rx="4" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
    <text x="121" y="136" font-family="'Hiragino Kaku Gothic ProN', 'Noto Sans JP', sans-serif" font-size="9" font-weight="800" fill="#1d4ed8" text-anchor="middle">495社（全体の99%）</text>
    <text x="121" y="146" font-family="'Hiragino Kaku Gothic ProN', 'Noto Sans JP', sans-serif" font-size="8.5" font-weight="600" fill="#2563eb" text-anchor="middle">原点付近に真っ黒に密集！</text>

    <!-- Outliers (Giant Companies) -->
    <g>
      <!-- Ring highlights -->
      <circle cx="230" cy="72" r="8" fill="none" stroke="#fecdd3" stroke-width="2"/>
      <circle cx="230" cy="72" r="5" fill="#e11d48" stroke="#ffffff" stroke-width="1.2"/>

      <circle cx="258" cy="52" r="8" fill="none" stroke="#fecdd3" stroke-width="2"/>
      <circle cx="258" cy="52" r="5" fill="#e11d48" stroke="#ffffff" stroke-width="1.2"/>

      <circle cx="282" cy="36" r="9" fill="none" stroke="#fca5a5" stroke-width="2"/>
      <circle cx="282" cy="36" r="5.5" fill="#e11d48" stroke="#ffffff" stroke-width="1.2"/>
    </g>

    <!-- Outliers Badge -->
    <rect x="170" y="12" width="132" height="19" rx="4" fill="#fef2f2" stroke="#fca5a5" stroke-width="1"/>
    <text x="236" y="25" font-family="'Hiragino Kaku Gothic ProN', 'Noto Sans JP', sans-serif" font-size="9.5" font-weight="800" fill="#b91c1c" text-anchor="middle">超巨大企業数社（外れ値）</text>

    <!-- Line 1: True trend of the 99% cluster -->
    <line x1="45" y1="184" x2="300" y2="180" stroke="#64748b" stroke-width="2" stroke-dasharray="4,3"/>
    <text x="180" y="174" font-family="'Hiragino Kaku Gothic ProN', 'Noto Sans JP', sans-serif" font-size="8.5" font-weight="700" fill="#64748b">495社本来の傾向（傾きほぼ0）</text>

    <!-- Line 2: OLS regression line (pulled up) -->
    <line x1="45" y1="182" x2="295" y2="28" stroke="#dc2626" stroke-width="2.5"/>
    <rect x="96" y="80" width="108" height="18" rx="3" fill="#dc2626"/>
    <text x="150" y="93" font-family="'Hiragino Kaku Gothic ProN', 'Noto Sans JP', sans-serif" font-size="9.5" font-weight="800" fill="#ffffff" text-anchor="middle">全500社の回帰直線</text>

    <!-- Lever upward pull arrow -->
    <path d="M 226 160 Q 236 120 238 88" fill="none" stroke="#ea580c" stroke-width="2" marker-end="url(#arrow-pull)"/>
    <rect x="184" y="106" width="62" height="23" rx="4" fill="#fff7ed" stroke="#fdba74" stroke-width="1"/>
    <text x="215" y="117" font-family="'Hiragino Kaku Gothic ProN', 'Noto Sans JP', sans-serif" font-size="8.5" font-weight="800" fill="#c2410c" text-anchor="middle">てこの原理</text>
    <text x="215" y="126" font-family="'Hiragino Kaku Gothic ProN', 'Noto Sans JP', sans-serif" font-size="8" font-weight="700" fill="#ea580c" text-anchor="middle">で引き上げる！</text>
  </g>

  <!-- ================= RIGHT: 3-Step Twist Logic ================= -->
  <g transform="translate(338, 10)">
    <!-- Header Badge -->
    <rect x="0" y="0" width="270" height="22" rx="4" fill="#fdf4ff" stroke="#d8b4fe" stroke-width="1"/>
    <text x="135" y="15" font-family="'Hiragino Kaku Gothic ProN', 'Noto Sans JP', sans-serif" font-size="10.5" font-weight="800" fill="#7e22ce" text-anchor="middle">外れ値による「回帰直線の歪み」の構造</text>

    <!-- Step 1 Card -->
    <g transform="translate(0, 28)">
      <rect x="0" y="0" width="270" height="56" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <rect x="8" y="6" width="76" height="15" rx="3" fill="#64748b"/>
      <text x="46" y="17" font-family="'Hiragino Kaku Gothic ProN', 'Noto Sans JP', sans-serif" font-size="8.5" font-weight="700" fill="#ffffff" text-anchor="middle">① 巨大な外れ値</text>
      <text x="88" y="18" font-family="'Hiragino Kaku Gothic ProN', 'Noto Sans JP', sans-serif" font-size="10" font-weight="800" fill="#1e293b">右上に数社だけポツンと存在</text>
      <text x="10" y="34" font-family="'Hiragino Kaku Gothic ProN', 'Noto Sans JP', sans-serif" font-size="9" font-weight="500" fill="#475569">OLSはズレの「2乗」を最小化するため、</text>
      <text x="10" y="47" font-family="'Hiragino Kaku Gothic ProN', 'Noto Sans JP', sans-serif" font-size="9" font-weight="700" fill="#334155">遠く離れた数社の巨大ペナルティを猛烈に恐れる</text>
    </g>

    <!-- Arrow 1 -> 2 -->
    <line x1="135" y1="84" x2="135" y2="92" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow-step-down)"/>

    <!-- Step 2 Card -->
    <g transform="translate(0, 96)">
      <rect x="0" y="0" width="270" height="56" rx="6" fill="#fff7ed" stroke="#fed7aa" stroke-width="1"/>
      <rect x="8" y="6" width="76" height="15" rx="3" fill="#ea580c"/>
      <text x="46" y="17" font-family="'Hiragino Kaku Gothic ProN', 'Noto Sans JP', sans-serif" font-size="8.5" font-weight="700" fill="#ffffff" text-anchor="middle">② てこの原理</text>
      <text x="88" y="18" font-family="'Hiragino Kaku Gothic ProN', 'Noto Sans JP', sans-serif" font-size="10" font-weight="800" fill="#9a3412">直線全体をグイッと引っ張る！</text>
      <text x="10" y="34" font-family="'Hiragino Kaku Gothic ProN', 'Noto Sans JP', sans-serif" font-size="9" font-weight="500" fill="#7c2d12">原点から最も遠い点が「テコの力点」となり、</text>
      <text x="10" y="47" font-family="'Hiragino Kaku Gothic ProN', 'Noto Sans JP', sans-serif" font-size="9" font-weight="700" fill="#c2410c">たった数社が回帰直線の傾きを強引に跳ね上げる</text>
    </g>

    <!-- Arrow 2 -> 3 -->
    <line x1="135" y1="152" x2="135" y2="160" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow-step-down)"/>

    <!-- Step 3 Card -->
    <g transform="translate(0, 164)">
      <rect x="0" y="0" width="270" height="66" rx="6" fill="#fef2f2" stroke="#fca5a5" stroke-width="1"/>
      <rect x="8" y="6" width="76" height="15" rx="3" fill="#dc2626"/>
      <text x="46" y="17" font-family="'Hiragino Kaku Gothic ProN', 'Noto Sans JP', sans-serif" font-size="8.5" font-weight="700" fill="#ffffff" text-anchor="middle">③ 錯覚の決定係数</text>
      <text x="88" y="18" font-family="'Hiragino Kaku Gothic ProN', 'Noto Sans JP', sans-serif" font-size="10" font-weight="800" fill="#991b1b">左下495社には全く合致せず！</text>
      <text x="10" y="34" font-family="'Hiragino Kaku Gothic ProN', 'Noto Sans JP', sans-serif" font-size="9" font-weight="500" fill="#7f1d1d">統計ソフト上は「R² ＝ 0.61」と良好に見えるが、</text>
      <text x="10" y="47" font-family="'Hiragino Kaku Gothic ProN', 'Noto Sans JP', sans-serif" font-size="9" font-weight="800" fill="#b91c1c">実は99%の一般企業を無視したハリボテの直線！</text>
      <text x="10" y="58" font-family="'Hiragino Kaku Gothic ProN', 'Noto Sans JP', sans-serif" font-size="8.5" font-weight="700" fill="#7f1d1d">（＝ 次スライドで上位5社を除外して検証！）</text>
    </g>
  </g>
</svg>